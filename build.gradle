plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "head-in-a-jar"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
        resources.exclude '.cache/**'
    }
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // Dev-only hidden client that drives itself: tools/smoke.sh
    smoke {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
    smokeImplementation.extendsFrom implementation
    smokeCompileOnly.extendsFrom compileOnly
    smokeRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version

    addModdingDependenciesTo(sourceSets.gametest)
    addModdingDependenciesTo(sourceSets.smoke)

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run-client')
            programArguments.addAll('--username', 'Dev', '--width', '1280', '--height', '720')
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll('--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath())
        }
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        smokeClient {
            client()
            sourceSet = sourceSets.smoke
            gameDirectory = project.file('run-smoke')
            programArguments.addAll('--username', 'Dev', '--width', '1280', '--height', '720', '--fml.mixin.config', 'headinajar.smoke.mixins.json')
            systemProperty 'headinajar.smoke', 'true'
            jvmArgument '-Xmx3G'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
            sourceSet(sourceSets.smoke)
        }
    }
}


tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

