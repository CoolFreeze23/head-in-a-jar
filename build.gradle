plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "head-in-a-jar"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // GeckoLib's own Maven repository (from its installation page)
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup('software.bernie.geckolib')
        }
    }
    // the optional integrations, compiled against only (from each project's developer instructions)
    maven {
        name = 'BlameJared' // JEI and Patchouli
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup('mezz.jei')
            includeGroup('vazkii.patchouli')
        }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup('top.theillusivec4.curios')
        }
    }
    maven {
        name = 'Modrinth' // Jade, Entity Model and Texture Features, Shoulder Surfing Reloaded
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup('maven.modrinth')
        }
    }
}

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
        resources.exclude '.cache/**'
    }
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // Dev-only hidden client that drives itself: tools/smoke.sh
    smoke {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
    smokeImplementation.extendsFrom implementation
    smokeCompileOnly.extendsFrom compileOnly
    smokeRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version

    addModdingDependenciesTo(sourceSets.gametest)
    addModdingDependenciesTo(sourceSets.smoke)

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run-client')
            programArguments.addAll('--username', 'Dev', '--width', '1280', '--height', '720')
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll('--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath())
        }
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        smokeClient {
            client()
            sourceSet = sourceSets.smoke
            // SMOKE_GAME_DIR: another game folder (the "pack" settings profile uses run-smoke-pack); the script and the
            // report stay in run-smoke either way
            gameDirectory = project.file(System.getenv('SMOKE_GAME_DIR') ?: 'run-smoke')
            programArguments.addAll('--username', 'Dev', '--width', System.getenv('SMOKE_WIDTH') ?: '1280',
                    '--height', System.getenv('SMOKE_HEIGHT') ?: '720', '--fml.mixinConfig', 'headinajar.smoke.mixins.json')
            systemProperty 'headinajar.smoke', 'true'
            systemProperty 'headinajar.smoke.out', project.file('run-smoke/smoke-out').absolutePath
            systemProperty 'headinajar.smoke.script', project.file('run-smoke/smoke-script.txt').absolutePath
            jvmArgument '-Xmx3G'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
            sourceSet(sourceSets.smoke)
        }
    }
}


dependencies {
    // required: animated machines, mecha and shells
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // optional integrations (compat/): compiled against only, never shipped or required; each hook loads only when its
    // mod is present
    [
            "mezz.jei:jei-${minecraft_version}-common-api:19.57.0.450",
            "mezz.jei:jei-${minecraft_version}-neoforge-api:19.57.0.450",
            "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE:api",
            "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api",
            "maven.modrinth:jade:15.10.6+neoforge",
            "maven.modrinth:entity-model-features:3.3.9-neoforge-1.21",
            "maven.modrinth:entitytexturefeatures:7.2.4-neoforge-1.21", // types in Entity Model Features' API
            "maven.modrinth:shoulder-surfing-reloaded:1.21.1-5.2.0+neoforge",
    ].each { compileOnly(it) { transitive = false } }
    // the local folders below are for the hidden dev client only (tools/smoke.sh), not for building the mod
    // the hidden smoke client also runs them, so their screens and tooltips can be checked
    // (SMOKE_MODS containing "noemf" leaves Entity Model Features and Entity Texture Features out)
    def smokeMods = (System.getenv('SMOKE_MODS') ?: '').toLowerCase().split('[ ,]+').findAll { it } as Set
    smokeRuntimeOnly fileTree(dir: 'libs', include: ['*.jar'],
            exclude: smokeMods.contains('noemf') ? ['entity_model_features*', 'entity_texture_features*'] : [])
    // SMOKE_PACK_MODS=1 (or SMOKE_MODS=anim) also runs the pack's animation mods (libs-smoke/*.jar, not committed)
    if (System.getenv('SMOKE_PACK_MODS') || smokeMods.contains('anim')) smokeRuntimeOnly fileTree(dir: 'libs-smoke', include: ['*.jar'])
    // SMOKE_MODS=sodium,iris,shoulder,camera,culling,...: each group is the folder libs-smoke/<group> (iris brings sodium)
    if (smokeMods.contains('iris')) smokeMods += 'sodium'
    smokeMods.findAll { !(it in ['anim', 'noemf']) }.each { group ->
        smokeRuntimeOnly fileTree(dir: "libs-smoke/${group}", include: ['*.jar'])
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            geckolib_version_range : geckolib_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

