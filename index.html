<script>
const DATA = {"meta": {"title": {"en": "Head in a Jar · Noggin & Sons recruitment brochure", "pt": "Head in a Jar · Folheto de recrutamento da Noggin & Sons"}, "description": {"en": "A Minecraft mod for NeoForge 1.21.1: lose your head on purpose, live in a jar, ride mob bodies, pilot mecha, splice genes and put other heads to work.", "pt": "Um mod de Minecraft para NeoForge 1.21.1: perca a cabeça de propósito, viva num pote, monte em corpos de criaturas, pilote mechas, emende genes e ponha outras cabeças para trabalhar."}, "mod_name": "Head in a Jar", "company": "Noggin & Sons", "release": {"en": "Release 0.7.1 · Secondment", "pt": "Versão 0.7.1 · Destacamento"}}, "hero": {"kicker": {"en": "Noggin & Sons · Head Office · Now hiring", "pt": "Noggin & Sons · Sede · Vagas abertas"}, "headline": [{"en": "Lose your head.", "pt": "Perca a cabeça."}, {"en": "Keep your job.", "pt": "Não perca o emprego."}], "lede": {"en": "Sit in the Separation Chair, sign Form 27-B and lose your head on purpose. Your head lives in a life-support jar; your headless body walks about on a wireless neuro-link. Then it gets stranger. You can ride a headless cow, pilot a mecha you built yourself, splice in genes from things you've sampled, and put other heads on the payroll.", "pt": "Sente na Cadeira de Separação, assine o Formulário 27-B e perca a cabeça de propósito. Ela vai morar num pote de suporte vital, e seu corpo sem cabeça segue andando por aí numa neuroconexão sem fio. Depois a coisa fica mais estranha. Dá para montar numa vaca sem cabeça, pilotar um mecha que você mesmo montou, emendar genes de bichos que você amostrou e pôr a cabeça dos outros na folha de pagamento."}, "tagline": {"en": "An employee programme for the ambitious and the slightly unhinged.", "pt": "Um programa de colaboradores para os ambiciosos e os meio desequilibrados."}, "primary_button": {"en": "Apply now", "pt": "Candidate-se"}, "secondary_button": {"en": "Tour the departments", "pt": "Conheça os departamentos"}, "requirement_line": {"en": "Minecraft 1.21.1 · NeoForge 21.1.200+ · GeckoLib 4.x (4.9.3+) · client and server · English and Brazilian Portuguese", "pt": "Minecraft 1.21.1 · NeoForge 21.1.200+ · GeckoLib 4.x (4.9.3+) · cliente e servidor · inglês e português do Brasil"}, "media": [{"file": "operation.gif", "alt": {"en": "The Separation Chair at work: the barrier comes down, the hood scans the patient, the claw carries the head into the jar on the tray", "pt": "A Cadeira de Separação em ação: a barreira desce, o capuz escaneia o paciente, a garra leva a cabeça até o pote na bandeja"}, "tags": ["chair"], "caption": {"en": "The operation, seen by a colleague (shown at double speed). Sit down with Use and hold the Sign button on its screen.", "pt": "A operação, vista por um colega (em velocidade dobrada). Sente com Usar e segure o botão Assinar na tela dela."}}]}, "facts": [{"value": "23", "label": {"en": "jar modules", "pt": "módulos de pote"}, "source": {"en": "All 23 jar modules: recipe, what it does, cost", "pt": "Todos os 23 módulos de pote: receita, o que faz, custo"}}, {"value": "8", "label": {"en": "mecha frames, plus three Utility Shells", "pt": "estruturas de mecha, mais três Cascos Utilitários"}, "source": {"en": "The eight frames and the three shells.", "pt": "As oito estruturas e os três cascos."}}, {"value": "58", "label": {"en": "mecha modules", "pt": "módulos de mecha"}, "source": {"en": "58 modules in six kinds.", "pt": "58 módulos em seis tipos."}}, {"value": "9", "label": {"en": "Collar Cam upgrades", "pt": "melhorias da Câmera de Colar"}, "source": {"en": "The nine Collar Cam upgrades", "pt": "As nove melhorias da Câmera de Colar"}}, {"value": "89", "label": {"en": "genes to splice", "pt": "genes para emendar"}, "source": {"en": "Every natural vanilla creature now carries at least one gene: forty new ones, eighty-nine in all.", "pt": "Toda criatura vanilla natural agora carrega pelo menos um gene: quarenta novos, oitenta e nove ao todo."}}, {"value": "56", "label": {"en": "advancements on the career ladder", "pt": "conquistas no plano de carreira"}, "source": {"en": "Fifty-six, in their own tab, starting at Orientation Day", "pt": "Cinquenta e seis, numa aba própria, começando em Dia de Integração"}}], "first_week": {"title": {"en": "Your first week at Head Office", "pt": "Sua primeira semana na Sede"}, "lede": {"en": "Getting from a fresh world to a head in a jar takes about a week. The Employee Handbook is in your hotbar from day one, and the advancements tab tells you what's next.", "pt": "De um mundo novo até uma cabeça no pote leva mais ou menos uma semana. O Manual do Funcionário está na sua barra de atalhos desde o primeiro dia, e a aba de conquistas diz o que vem depois."}, "days": [{"day": 1, "title": {"en": "Surgical Steel and parts", "pt": "Aço Cirúrgico e peças"}, "text": {"en": "Smelt iron, bone meal and coal into Surgical Steel, then make wire, lenses, servos and chips.", "pt": "Funda ferro, farinha de osso e carvão em Aço Cirúrgico, depois faça fios, lentes, servos e chips."}}, {"day": 2, "title": {"en": "Power and saline", "pt": "Energia e soro"}, "text": {"en": "Feed a Galvanic Pile rotten flesh and mix four bottles of Cranial Saline. Heads get thirsty.", "pt": "Alimente uma Pilha Galvânica com carne podre e prepare quatro frascos de Soro Craniano. Cabeça também sente sede."}}, {"day": 3, "title": {"en": "The kit", "pt": "O kit"}, "text": {"en": "Craft your new home, a Life Support Jar, plus Relay Goggles, a Collar Cam, a Head Satchel and a Suture Kit.", "pt": "Fabrique seu novo lar, um Pote de Suporte Vital, mais Óculos Retransmissores, uma Câmera de Colar, uma Bolsa de Cabeça e um Kit de Sutura."}}, {"day": 4, "title": {"en": "The operation", "pt": "A operação"}, "text": {"en": "Sit in the Separation Chair, hold Sign for two seconds, and let DOLORES finish.", "pt": "Sente na Cadeira de Separação, segure Assinar por dois segundos e deixe a DOLORES terminar."}}, {"day": 5, "title": {"en": "Living with it", "pt": "Convivendo com isso"}, "text": {"en": "Carry your head, dock it in a Cradle, and Swap between body and head whenever you like.", "pt": "Carregue sua cabeça, acople-a num Berço e troque entre corpo e cabeça quando quiser."}}, {"day": 6, "title": {"en": "When it goes wrong", "pt": "Quando dá errado"}, "text": {"en": "Walked too far? Roll home in your jar, book the Courier, or sew your head back on.", "pt": "Andou longe demais? Volte rolando no pote, chame o Entregador ou costure a cabeça de volta."}}, {"day": 7, "title": {"en": "What's next", "pt": "E depois"}, "text": {"en": "Borrow a mob's body, build a mecha, start the lab, or put other heads to work.", "pt": "Pegue emprestado o corpo de uma criatura, construa um mecha, monte o laboratório ou ponha outras cabeças para trabalhar."}}]}, "departments": [{"id": "separation-chair", "dept_label": {"en": "Dept. 01 · Onboarding", "pt": "Depto. 01 · Integração"}, "title": {"en": "The Separation Chair", "pt": "A Cadeira de Separação"}, "lede": {"en": "Sit down, sign Form 27-B and hold still for twelve seconds. DOLORES staffs the chair, and she is very professional about it.", "pt": "Sente, assine o Formulário 27-B e fique parado por doze segundos. Quem opera a cadeira é a DOLORES, e ela leva o trabalho muito a sério."}, "points": [{"en": "Bring one jar, a pair of Relay Goggles, a Collar Cam, four bottles of Cranial Saline and 40,000 FE.", "pt": "Traga um pote, um par de Óculos Retransmissores, uma Câmera de Colar, quatro frascos de Soro Craniano e 40.000 FE."}, {"en": "Everyone nearby gets to watch: barrier, pleasant gas, scan, blade, claw, jar.", "pt": "Quem estiver por perto assiste a tudo: barreira, gás agradável, escaneamento, lâmina, garra, pote."}, {"en": "Changed your mind? Sneak in the first five seconds. After that, the restraints hold.", "pt": "Mudou de ideia? Agache nos primeiros cinco segundos. Depois disso, as amarras não soltam mais."}, {"en": "A worn blade can botch the cut, which leaves you upside down for 30 seconds and your Collar Cam crooked. Fit a Replacement Blade.", "pt": "Uma lâmina gasta pode errar o corte: você fica de cabeça para baixo por 30 segundos e com a Câmera de Colar torta. Instale uma Lâmina de Reposição."}, {"en": "DOLORES speaks her lines aloud, in English or Brazilian Portuguese, and sends you a memo the first time anything new happens.", "pt": "A DOLORES diz as falas em voz alta, em inglês ou português do Brasil, e manda um memorando na primeira vez que acontece algo novo."}, {"en": "Every new hire is handed the Employee Handbook: ten chapters, the company's forms, and a Patchouli edition if you have it.", "pt": "Todo novo contratado ganha o Manual do Funcionário: dez capítulos, os formulários da empresa e uma edição Patchouli, se você tiver o mod."}], "memo": {"key": "dolores.headinajar.jar", "speaker": {"en": "DOLORES", "pt": "DOLORES"}, "en": "Your head is now in a jar. Congratulations on your promotion.", "pt": "Sua cabeça agora está num pote. Parabéns pela promoção."}, "media": [{"file": "chair.png", "alt": {"en": "The Separation Chair after an operation: the barrier up, the seat empty, and the patient's head in its jar on the tray to the left as the patient sits, its lid lamp green", "pt": "A Cadeira de Separação depois de uma operação: a barreira erguida, o assento vazio e a cabeça do paciente no pote, na bandeja à esquerda de quem senta, com a lâmpada da tampa acesa em verde"}, "tags": ["chair"]}, {"file": "botch.gif", "alt": {"en": "The Separation Chair with a worn blade fumbles the cut, and the head ends up upside down in its jar", "pt": "A Cadeira de Separação com a lâmina gasta erra o corte, e a cabeça acaba de cabeça para baixo no pote"}, "tags": ["chair"], "caption": {"en": "A worn blade can botch it. DOLORES has a word for that.", "pt": "Uma lâmina gasta pode errar o corte. A DOLORES tem uma palavra para isso."}}, {"file": "memo.png", "alt": {"en": "Close in front of a jar, its headless body standing behind it with its arms over the lid; a memo from DOLORES in chat saying jars have no hands and where a Manipulator Arm comes from, its lines sitting above the jar's glass, saline and charge bars", "pt": "De perto, na frente de um pote, com o corpo sem cabeça dele em pé atrás, os braços sobre a tampa; um memorando da DOLORES no chat dizendo que potes não têm mãos e de onde vem um Braço Manipulador, com as linhas acima das barras de vidro, soro e carga do pote"}, "tags": ["chair", "jar"], "caption": {"en": "DOLORES writes the first time anything happens to you. This one is about hands.", "pt": "A DOLORES escreve na primeira vez que algo acontece com você. Este é sobre mãos."}}, {"file": "handbook.png", "alt": {"en": "The Employee Handbook, second edition, open in Patchouli on its landing page: the welcome text and the chapter icons", "pt": "O Manual do Funcionário, segunda edição, aberto no Patchouli na página inicial: o texto de boas-vindas e os ícones dos capítulos"}, "tags": ["chair"], "caption": {"en": "The Employee Handbook, second edition.", "pt": "O Manual do Funcionário, segunda edição."}}]}, {"id": "living-headless", "dept_label": {"en": "Dept. 02 · Remote Working", "pt": "Depto. 02 · Trabalho Remoto"}, "title": {"en": "Living with your head off", "pt": "Vivendo sem a cabeça"}, "lede": {"en": "Your headless body walks about on a wireless neuro-link, and you see through the Collar Cam on its neck. Your head waits in its jar drinking saline, unless you take it with you.", "pt": "Seu corpo sem cabeça anda por aí numa neuroconexão sem fio, e você enxerga pela Câmera de Colar no pescoço dele. A cabeça fica no pote bebendo soro, a não ser que você a leve junto."}, "points": [{"en": "The link weakens with distance. Relay Goggles Mk I reach 48 blocks, Quantum Goggles the whole dimension, and Relay Masts carry it further.", "pt": "A conexão enfraquece com a distância. Os Óculos Retransmissores Mk I alcançam 48 blocos, os Óculos Quânticos a dimensão inteira, e Mastros Retransmissores levam mais longe."}, {"en": "Swap between body and head whenever you like. A body left alone stands to attention for a while, fidgets, then sits down cross-legged.", "pt": "Troque entre corpo e cabeça quando quiser. Deixado sozinho, o corpo fica em posição de sentido, se mexe um pouco e depois senta de pernas cruzadas."}, {"en": "Carry your head in a Head Satchel, hugged in front or slung on your back. The link is perfect and it drinks no saline.", "pt": "Carregue a cabeça numa Bolsa de Cabeça, abraçada na frente ou nas costas. A conexão fica perfeita e ela não gasta soro."}, {"en": "Saline, glass and charge each run out in their own way. A Life Support Cradle keeps a docked head topped up.", "pt": "Soro, vidro e carga acabam cada um do seu jeito. Um Berço de Suporte Vital mantém abastecida uma cabeça acoplada."}, {"en": "If your linked body dies, it stays where it fell with your things on it, and you wake up in your jar. Book the Courier and the body is back in 30 seconds, from anywhere.", "pt": "Se o corpo conectado morrer, ele fica onde caiu, com as suas coisas, e você acorda no pote. Chame o Entregador e o corpo volta em 30 segundos, de onde estiver."}, {"en": "A Suture Kit puts your head back on. Lost the body for good? The Body Printer prints a new one, a little damp.", "pt": "Um Kit de Sutura põe a cabeça de volta. Perdeu o corpo de vez? A Impressora de Corpos imprime outro, ainda meio úmido."}], "memo": {"key": "message.headinajar.body.hr_card", "speaker": {"en": "Head Office", "pt": "Sede"}, "en": "Your body has died. HR has sent a card.", "pt": "Seu corpo faleceu. O RH mandou um cartão."}, "media": [{"file": "carry_hug.gif", "alt": {"en": "A headless player walks towards the camera hugging a jar with a head in it, a hand on each side", "pt": "Um jogador sem cabeça anda em direção à câmera abraçando um pote com uma cabeça dentro, uma mão de cada lado"}, "tags": ["bodies", "jar"], "caption": {"en": "Hugging your own head. Use it with an empty hand while you have a Head Satchel.", "pt": "Abraçando a própria cabeça. Use nela com a mão vazia, com uma Bolsa de Cabeça no inventário."}}, {"file": "commute_bystander.gif", "alt": {"en": "A headless body beside its jar: it powers down and clasps its hands behind its back as the mind leaves, then a teal ring flashes round it as the mind comes back and it shakes awake", "pt": "Um corpo sem cabeça ao lado do seu pote: ele desliga e cruza as mãos atrás das costas quando a mente sai, depois um anel verde-azulado pisca em volta dele quando a mente volta e ele desperta com um tremor"}, "tags": ["bodies"], "caption": {"en": "Swap, from the outside. The body stands easy when you leave and shakes itself awake when you come back.", "pt": "A troca, vista de fora. O corpo fica em descanso quando você sai e acorda com um tremor quando você volta."}}, {"file": "body_waiting.gif", "alt": {"en": "A headless body waiting at attention with its hands behind its back, patting its pockets, sitting down cross-legged, and waving at its jar", "pt": "Um corpo sem cabeça esperando em posição de sentido com as mãos atrás das costas, apalpando os bolsos, sentando de pernas cruzadas e acenando para o seu pote"}, "tags": ["bodies"], "caption": {"en": "A body left standing: at attention, a fidget, sitting down after three minutes, and a wave when its jar comes to look (time sped up between clips).", "pt": "Um corpo deixado de pé: em posição de sentido, uma mexida, senta depois de três minutos e acena quando o pote vem olhar (tempo acelerado entre os trechos)."}}, {"file": "corpse.gif", "alt": {"en": "Seen from the side, a headless body flinches, sits down hard as its knees go and tips onto its back", "pt": "Visto de lado, um corpo sem cabeça estremece, senta com força quando os joelhos cedem e tomba de costas"}, "tags": ["bodies"], "caption": {"en": "A linked body dying where it stood.", "pt": "Um corpo conectado morrendo onde estava."}}, {"file": "body_printer.gif", "alt": {"en": "The Body Printer finishing a print: the booth door swings open and a new body steps out", "pt": "A Impressora de Corpos terminando uma impressão: a porta da cabine se abre e um corpo novo sai"}, "tags": ["bodies", "machines"], "caption": {"en": "A fresh body from the Body Printer. Press Print as a jar once it's loaded.", "pt": "Um corpo novo saindo da Impressora de Corpos. Aperte Imprimir como pote, com a máquina carregada."}}]}, {"id": "jars-and-gear", "dept_label": {"en": "Dept. 03 · Equipment", "pt": "Depto. 03 · Equipamentos"}, "title": {"en": "Jars and telepresence gear", "pt": "Potes e equipamento de telepresença"}, "lede": {"en": "Four jars, from the plain Life Support Jar up to the Executive, each with more slots, charge, saline and glass than the last. The gear on your head and neck decides how far you can wander.", "pt": "Quatro potes, do Pote de Suporte Vital simples ao Executivo, cada um com mais encaixes, carga, soro e vidro que o anterior. O equipamento na cabeça e no pescoço decide até onde você pode ir."}, "points": [{"en": "Life Support and Compact Jars: 3 module slots, 100 kFE, 1,000 mB of saline, 10 points of glass.", "pt": "Pote de Suporte Vital e Pote Compacto: 3 encaixes de módulo, 100 kFE, 1.000 mB de soro, 10 pontos de vidro."}, {"en": "The Reinforced Jar has 5 slots, 250 kFE, 1,500 mB and 20 glass. The Executive has 7 slots, 500 kFE, 2,000 mB and 30 glass. Both are fire-proof.", "pt": "O Pote Reforçado tem 5 encaixes, 250 kFE, 1.500 mB e 20 de vidro. O Executivo tem 7 encaixes, 500 kFE, 2.000 mB e 30 de vidro. Os dois são à prova de fogo."}, {"en": "Relay Goggles Mk I, II and III reach 48, 160 and 640 blocks. Quantum Goggles reach the whole dimension.", "pt": "Os Óculos Retransmissores Mk I, II e III alcançam 48, 160 e 640 blocos. Os Óculos Quânticos, a dimensão inteira."}, {"en": "A Collar Cam takes four of its nine upgrades at once, anything from a Periscope Stalk to a Zoom Optic.", "pt": "Uma Câmera de Colar aceita quatro das nove melhorias ao mesmo tempo, da Haste de Periscópio à Óptica de Zoom."}, {"en": "An Entangled Pair carries the link into other dimensions, and a headless body through portals.", "pt": "Um Par Emaranhado leva a conexão para outras dimensões, e um corpo sem cabeça através de portais."}, {"en": "The EMP Grenade drops linked bodies back into their heads and halves every jar's charge nearby.", "pt": "A Granada de PEM devolve corpos conectados às suas cabeças e corta pela metade a carga dos potes por perto."}], "memo": {"key": "dolores.headinajar.refuse.collar", "speaker": {"en": "DOLORES", "pt": "DOLORES"}, "en": "Collar Cam required. Your neck needs a hat.", "pt": "Câmera de Colarinho necessária. Seu pescoço precisa de um chapéu."}, "media": [{"file": "jars.png", "alt": {"en": "Left, a Life Support Jar riding a headless cow, its saline full and its brass collar round the base; right, a Compact Jar, head-sized, riding a headless husk", "pt": "À esquerda, um Pote de Suporte Vital montado numa vaca sem cabeça, com o soro cheio e o colar de latão em volta da base; à direita, um Pote Compacto, do tamanho de uma cabeça, montado num zumbi-múmia sem cabeça"}, "tags": ["jar"], "caption": {"en": "A Life Support Jar on a cow and a Compact Jar on a husk.", "pt": "Um Pote de Suporte Vital numa vaca e um Pote Compacto num zumbi-múmia."}}, {"file": "jar_levels.gif", "alt": {"en": "Three heads set down side by side on the grass: a nearly dry jar whose lid lamp pulses amber, a half-full one and a full one, both with green lamps", "pt": "Três cabeças pousadas lado a lado na grama: um pote quase seco cuja lâmpada na tampa pulsa em âmbar, um meio cheio e um cheio, ambos com lâmpadas verdes"}, "tags": ["jar"], "caption": {"en": "You can read a jar from across the room. Saline shows through the glass, and the lid lamp pulses amber when charge runs low.", "pt": "Dá para ler um pote do outro lado da sala. O soro aparece pelo vidro, e a lâmpada da tampa pisca em âmbar quando a carga está baixa."}}, {"file": "hud.png", "alt": {"en": "The HUD at GUI scale 3 while riding an enderman: the host panel at the top left; by the hotbar the enderman's two rows of hearts and under them the jar's three marked bars with their numbers, glass 10/10, charge 17%; no hearts or armour row of the jar's own", "pt": "O HUD na escala de interface 3, montado num enderman: o painel do hospedeiro no alto à esquerda; junto à barra de atalhos, as duas fileiras de corações do enderman e, abaixo delas, as três barras marcadas do pote com seus números, vidro 10/10, carga 17%; nenhuma fileira de corações ou de armadura do próprio pote"}, "tags": ["jar"], "caption": {"en": "The HUD while riding an enderman: the host panel at the top left, the jar's glass, saline and charge by the hotbar.", "pt": "O HUD montado num enderman: o painel do hospedeiro no alto à esquerda, e o vidro, o soro e a carga do pote junto à barra de atalhos."}}]}, {"id": "facilities", "dept_label": {"en": "Dept. 04 · Facilities", "pt": "Depto. 04 · Instalações"}, "title": {"en": "Power and life-support blocks", "pt": "Blocos de energia e de suporte vital"}, "lede": {"en": "The company runs on FE, and its favourite fuel is meat. Every machine moves while it works and has a lamp, so you can tell how it's getting on from across the yard.", "pt": "A empresa funciona com FE, e o combustível preferido dela é carne. Toda máquina se mexe enquanto trabalha e tem uma lâmpada, para você ver de longe como ela está indo."}, "points": [{"en": "The Galvanic Pile eats rotten flesh, 4,000 FE a piece, and powers whatever machine is touching it.", "pt": "A Pilha Galvânica come carne podre, 4.000 FE por pedaço, e alimenta a máquina que estiver encostada nela."}, {"en": "The Leyden Jar stores 250,000 FE. Two linked Tesla Nodes throw power 16 blocks along a crackling arc.", "pt": "A Garrafa de Leyden guarda 250.000 FE. Dois Nós de Tesla ligados jogam energia a 16 blocos num arco crepitante."}, {"en": "The Charging Dock and the Life Support Cradle keep jars and heads charged, topped up and mended.", "pt": "A Base de Recarga e o Berço de Suporte Vital mantêm potes e cabeças carregados, abastecidos e consertados."}, {"en": "Relay Masts carry your link 96 blocks (Mk II 192). A Signal Jammer cuts other people's to 30%.", "pt": "Mastros Retransmissores levam sua conexão a 96 blocos (Mk II, 192). Um Bloqueador de Sinal corta a dos outros para 30%."}, {"en": "The Saline Mixer is a soda fountain for Cranial Saline, by the bottle or the bucket.", "pt": "O Misturador de Soro é a chopeira do Soro Craniano: sai em frasco ou em balde."}, {"en": "Nineteen company notices for the Safety Placard, painted in your game's language.", "pt": "A Placa de Segurança tem dezenove avisos da empresa, pintados no idioma do seu jogo."}], "memo": {"key": "placard.headinajar.0", "speaker": {"en": "Safety Placard", "pt": "Placa de Segurança"}, "en": "HEADS MUST BE SECURED AT ALL TIMES", "pt": "CABEÇAS DEVEM FICAR PRESAS SEMPRE"}, "media": [{"file": "safety_placard.gif", "alt": {"en": "A Safety Placard on a stone-brick wall used fourteen times, a notice a second: from \"HEADS MUST BE SECURED AT ALL TIMES\" through \"DOLORES IS LISTENING\" to the two new ones, \"QUIET FLOOR: THE WARDEN IS WORKING\" and \"PLEASE DO NOT TAP THE GLASS\"", "pt": "Uma Placa de Segurança numa parede de tijolos de pedra usada catorze vezes, um aviso por segundo: de \"CABEÇAS DEVEM FICAR PRESAS SEMPRE\" passando por \"DOLORES ESTÁ OUVINDO\" até os dois novos, \"SILÊNCIO: WARDEN TRABALHANDO\" e \"FAVOR NÃO BATER NO VIDRO\""}, "tags": ["machines"], "caption": {"en": "Use a Safety Placard to change the notice.", "pt": "Use a Placa de Segurança para trocar o aviso."}}, {"file": "galvanic_pile.gif", "alt": {"en": "A Galvanic Pile at work: the press screw turning a quarter at a time, sparks at the terminals, the lamp pulsing amber", "pt": "Uma Pilha Galvânica trabalhando: o parafuso da prensa girando um quarto de volta por vez, faíscas nos terminais, a lâmpada pulsando em âmbar"}, "tags": ["machines"], "caption": {"en": "A Galvanic Pile digesting. Feed it rotten flesh.", "pt": "Uma Pilha Galvânica fazendo a digestão. Dê carne podre a ela."}}, {"file": "charging_dock.gif", "alt": {"en": "A head in its jar on a Charging Dock: the knife switch closes and the dial needle climbs", "pt": "Uma cabeça no pote sobre uma Base de Recarga: a chave-faca fecha e o ponteiro do mostrador sobe"}, "tags": ["machines"], "caption": {"en": "Set your jar on a Charging Dock and watch the needle climb.", "pt": "Ponha o pote numa Base de Recarga e veja o ponteiro subir."}}, {"file": "tesla_node.gif", "alt": {"en": "Two linked Tesla Nodes facing each other, a crackling arc running between their balls", "pt": "Dois Nós de Tesla ligados, um de frente para o outro, um arco crepitante correndo entre as esferas"}, "tags": ["machines"], "caption": {"en": "Two Tesla Nodes passing power. Link them with the Surgical Wrench, sender first.", "pt": "Dois Nós de Tesla passando energia. Ligue com a Chave Cirúrgica, primeiro o que envia."}}, {"file": "life_support_cradle.gif", "alt": {"en": "A head docked in a Life Support Cradle: the blanket laid over it and the bellows on the back rising", "pt": "Uma cabeça acomodada num Berço de Suporte Vital: o cobertor estendido sobre ela e o fole nas costas subindo"}, "tags": ["machines"], "caption": {"en": "Tucked in. Carrying your head, Use an empty Cradle.", "pt": "Bem acomodada. Carregando a cabeça, use um Berço vazio."}}]}, {"id": "jar-modules", "dept_label": {"en": "Dept. 05 · Professional Development", "pt": "Depto. 05 · Desenvolvimento Profissional"}, "title": {"en": "Jar modules", "pt": "Módulos de pote"}, "lede": {"en": "A head in a jar is a head. Modules are how Noggin & Sons makes it an employee again: up to seven per jar, one of each kind, fitted from the Jar menu.", "pt": "Uma cabeça num pote é só uma cabeça. Os módulos são como a Noggin & Sons faz dela um colaborador de novo: até sete por pote, um de cada tipo, instalados pelo Menu do pote."}, "points": [{"en": "The Telekinesis Module grabs creatures, items and plain blocks from 16 blocks off. Swing them about, then throw them.", "pt": "O Módulo de Telecinese agarra criaturas, itens e blocos simples a até 16 blocos. Dá para balançar e depois arremessar."}, {"en": "The Lacrimal Laser fires twin beams of tears, 2 hearts a shot, at the first creature within 8 blocks.", "pt": "O Laser Lacrimal dispara dois feixes de lágrimas, 2 corações por tiro, na primeira criatura a até 8 blocos."}, {"en": "Wheels drive you at half walking speed. Without them, the same key tips the jar on its side to roll.", "pt": "As Rodinhas levam você à metade da velocidade de caminhada. Sem elas, a mesma tecla tomba o pote de lado para ele rolar."}, {"en": "A Propeller to fly, Hop Springs to bounce, and Spider Legs or Suction Cups for walls.", "pt": "Hélice para voar, Molas Saltadoras para pular, e Pernas de Aranha ou Ventosas para subir paredes."}, {"en": "A Manipulator Arm gives you a hand. The rest include a Magnet, a Speaker Grille, a Shock Lid and a Body Recall Beacon: 23 in all.", "pt": "Um Braço Manipulador te dá uma mão. Entre os outros estão Ímã, Grade de Alto-falante, Tampa de Choque e Farol de Chamado do Corpo: 23 ao todo."}], "memo": {"key": "refusal.headinajar.jar.no_arm.attack", "speaker": {"en": "A jar, with a tap on the glass", "pt": "Um pote, com um toque no vidro"}, "placeholders_filled": true, "en": "Glaring is not an attack. Fit a Manipulator Arm.", "pt": "Encarar não é atacar. Instale um Braço Manipulador."}, "media": [{"file": "wheels.gif", "alt": {"en": "A jar on four little wheels drives towards the camera", "pt": "Um pote sobre quatro rodinhas vem em direção à câmera"}, "tags": ["jar"], "caption": {"en": "Half walking speed, and proud of it. Fit Wheels and press Drive.", "pt": "Metade da velocidade de caminhada, com orgulho. Instale as Rodinhas e aperte a tecla Rodinhas."}}, {"file": "telekinesis.gif", "alt": {"en": "Seen from behind and to one side, a jar lifts a cow on a glowing line, swings it round in front of itself and throws it", "pt": "Visto de trás e de lado, um pote ergue uma vaca numa linha luminosa, gira-a na sua frente e a arremessa"}, "tags": ["jar"], "caption": {"en": "Telekinesis. Ability grabs, looking moves it, Attack throws.", "pt": "Telecinese. Habilidade agarra, o olhar move, Atacar arremessa."}}, {"file": "laser.gif", "alt": {"en": "Side on, close: a jar weeps a thin beam onto a pig four blocks away, which flashes red; twice", "pt": "De lado, de perto: um pote chora um feixe fino num porco a quatro blocos, que pisca em vermelho; duas vezes"}, "tags": ["jar"], "caption": {"en": "Crying at a pig, professionally. Press Secondary as a jar.", "pt": "Chorando num porco, com profissionalismo. Aperte Secundária como pote."}}, {"file": "roll.gif", "alt": {"en": "A jar lying on its side rolls slowly across the grass", "pt": "Um pote deitado de lado rola devagar pela grama"}, "tags": ["jar"], "caption": {"en": "No wheels? Press Drive anyway. The jar tips over and rolls, very slowly.", "pt": "Sem rodinhas? Aperte a tecla Rodinhas mesmo assim. O pote tomba e rola, bem devagar."}}]}, {"id": "hostile-takeover", "dept_label": {"en": "Dept. 06 · Mergers & Acquisitions", "pt": "Depto. 06 · Fusões e Aquisições"}, "title": {"en": "Hostile Takeover", "pt": "Aquisição Hostil"}, "lede": {"en": "A creature with its head taken off keeps walking, provided someone steers. Noggin & Sons calls this a host. You are the someone.", "pt": "Uma criatura sem cabeça continua andando, desde que alguém conduza. A Noggin & Sons chama isso de hospedeiro. E esse alguém é você."}, "points": [{"en": "The Surgical Saw takes the head off a creature at half its health or less. It pops out like a champagne cork.", "pt": "A Serra Cirúrgica tira a cabeça de uma criatura com metade da vida ou menos. A cabeça sai feito rolha de champanhe."}, {"en": "As a jar, climb onto its neck, pass the Neural Handshake and steer. It goes where you look; fliers fly and spiders climb.", "pt": "Como pote, suba no pescoço dela, passe no Aperto de Mão Neural e conduza. Ela vai para onde você olha: se voa, você voa; se é aranha, você sobe parede."}, {"en": "Sync grows as you ride. At 25% you get the body's traits, at 50% its Ability, at 75% its Secondary. An enderman teleports; a warden has a Sonic Boom.", "pt": "A sincronia cresce enquanto você monta. A 25% vêm as características do corpo, a 50% a Habilidade, a 75% a Secundária. Um enderman se teleporta; um warden tem um Estrondo Sônico."}, {"en": "Hosts rot 2% a minute. Embalming Fluid slows it, Neural Lace stops it for good, and the Body Locker stops time for one.", "pt": "Hospedeiros apodrecem 2% por minuto. O Fluido de Embalsamar desacelera, a Renda Neural impede de vez, e o Armário de Corpos congela o tempo de um deles."}, {"en": "Park a host on the Corporate Wellness Treadmill and it walks for the company's power. A headless chicken just runs.", "pt": "Ponha um hospedeiro na Esteira de Bem-Estar Corporativo e ele caminha para gerar energia para a empresa. Galinha sem cabeça só sabe correr."}, {"en": "Brazil Legends' Headless Mule never had a head: no saw needed, and it never rots.", "pt": "A Mula-sem-cabeça do Brazil Legends nunca teve cabeça: dispensa a serra e nunca apodrece."}], "memo": {"key": "refusal.headinajar.saw.wither", "speaker": {"en": "The Surgical Saw", "pt": "A Serra Cirúrgica"}, "en": "The Wither has three heads and no Human Resources department.", "pt": "O Wither tem três cabeças e nenhum departamento de Recursos Humanos."}, "media": [{"file": "cork.gif", "alt": {"en": "A colleague saws a weakened cow: its head pops out of the neck and turns over as it rises, gone in a puff, and the headless cow stands on", "pt": "Um colega serra uma vaca enfraquecida: a cabeça salta do pescoço e dá uma cambalhota enquanto sobe, some numa baforada, e a vaca sem cabeça continua de pé"}, "tags": ["bodies"], "caption": {"en": "Pop. Use the Surgical Saw on a creature at half its health or less.", "pt": "Pop. Use a Serra Cirúrgica numa criatura com metade da vida ou menos."}}, {"file": "hosts.png", "alt": {"en": "Three hosts each carrying a jar on its neck in a brass collar: a cow, an enderman and a bat", "pt": "Três hospedeiros, cada um com um pote no pescoço preso por um colar de latão: uma vaca, um enderman e um morcego"}, "tags": ["bodies", "jar"], "caption": {"en": "A cow, an enderman and a bat, each under new management.", "pt": "Uma vaca, um enderman e um morcego, todos sob nova direção."}}, {"file": "seat.gif", "alt": {"en": "A jar climbs onto a headless cow's neck: the cow braces under it and a brass collar twists home round the jar's base", "pt": "Um pote sobe no pescoço de uma vaca sem cabeça: a vaca firma as pernas sob ele e um colar de latão gira até travar em volta da base do pote"}, "tags": ["bodies"], "caption": {"en": "Boarding. The collar locks round the jar.", "pt": "Embarque. O colar trava em volta do pote."}}, {"file": "company_gym.gif", "alt": {"en": "The company gym: a headless cow, chicken, horse and spider walk in place on Treadmills in a row against a brick wall, under two Safety Placards showing \"A HEALTHY BODY IS A PRODUCTIVE BODY\"", "pt": "A academia da empresa: uma vaca, uma galinha, um cavalo e uma aranha sem cabeça caminham sem sair do lugar em Esteiras enfileiradas junto a uma parede de tijolos, sob duas Placas de Segurança com \"CORPO SAUDÁVEL, CORPO PRODUTIVO\""}, "tags": ["machines", "bodies"], "caption": {"en": "The company gym. Hosts on Treadmills make the power; the placards provide the motivation.", "pt": "A academia da empresa. Os hospedeiros nas Esteiras geram a energia; as placas cuidam da motivação."}}, {"file": "fly.gif", "alt": {"en": "Seen from the side, a jar riding a headless bat climbs past a row of log posts, flies on, then sinks to the grass and sits there as the bat flies off", "pt": "Visto de lado, um pote montado num morcego sem cabeça sobe passando por uma fileira de postes de tronco, segue voando, depois desce até a grama e fica lá sentado enquanto o morcego vai embora voando"}, "tags": ["bodies"], "caption": {"en": "On a flier, hold Jump to climb and Sneak to come down and get off.", "pt": "Num voador, segure Pular para subir e Agachar para descer e sair."}}]}, {"id": "utility-shells", "dept_label": {"en": "Dept. 07 · Temp Agency", "pt": "Depto. 07 · Agência de Temporários"}, "title": {"en": "Utility Shells", "pt": "Cascos Utilitários"}, "lede": {"en": "Robot bodies for a jar, for days when a cow won't do. A shell never rots, needs no saw and no handshake, and is fully synced the moment you climb in.", "pt": "Corpos robóticos para um pote, para os dias em que uma vaca não serve. Um casco nunca apodrece, dispensa serra e aperto de mão, e já vem sincronizado quando você entra."}, "points": [{"en": "The Lunk has 33 hearts and can't be knocked back. It lifts creatures overhead and throws them.", "pt": "O Brutamontes tem 33 corações e não sofre repulsão. Ergue criaturas acima da cabeça e as arremessa."}, {"en": "The Rover does about 9 blocks a second, has a 9-slot cargo hold, and sprints with a bell.", "pt": "O Rover faz cerca de 9 blocos por segundo, tem um compartimento de carga de 9 espaços e dispara tocando campainha."}, {"en": "The Spider Walker climbs walls, never takes fall damage and shoots webs.", "pt": "O Andador Aranha escala paredes, nunca leva dano de queda e atira teias."}, {"en": "They run on your jar's charge: 3 FE a tick on top of the jar's own upkeep.", "pt": "Eles funcionam com a carga do seu pote: 3 FE por tick além do consumo do próprio pote."}, {"en": "Shells dent on the side they are hit, and a crash into a wall at speed costs the jar a knock.", "pt": "Cascos amassam do lado em que apanham, e bater numa parede em alta velocidade custa um tranco ao pote."}], "memo": {"key": "refusal.headinajar.treadmill.shell", "speaker": {"en": "Corporate Wellness Treadmill", "pt": "Esteira de Bem-Estar Corporativo"}, "en": "Shells run on charge, not cardio.", "pt": "Cascos andam com carga, não com cardio."}, "media": [{"file": "spider_walker_climb.gif", "alt": {"en": "From behind, a jar in a Spider Walker walks up to a stone wall, climbs straight up it and walks on across the top", "pt": "De trás, um pote num Andador Aranha caminha até um muro de pedra, sobe por ele em linha reta e segue andando por cima"}, "tags": ["bodies"], "caption": {"en": "Walk a Spider Walker into a wall and it keeps going.", "pt": "Ande com um Andador Aranha contra a parede e ele segue em frente."}}, {"file": "rover_sprint.gif", "alt": {"en": "From behind and to one side, a jar on a Rover drives off down a stone road past a row of log posts", "pt": "De trás e de lado, um pote num Rover sai dirigindo por uma estrada de pedra, passando por uma fileira de postes de tronco"}, "tags": ["bodies"], "caption": {"en": "The Rover's sprint. Press Ability.", "pt": "A disparada do Rover. Aperte Habilidade."}}, {"file": "lunk_toss.gif", "alt": {"en": "From behind, a jar in a Lunk lifts a pig overhead in its fists and throws it high into the air", "pt": "De trás, um pote num Brutamontes ergue um porco acima da cabeça com os punhos e o joga bem alto no ar"}, "tags": ["bodies"], "caption": {"en": "The Lunk's toss. Look at a creature within 4 blocks and press Ability.", "pt": "O arremesso do Brutamontes. Olhe para uma criatura a até 4 blocos e aperte Habilidade."}}]}, {"id": "personnel", "dept_label": {"en": "Dept. 08 · Human Resources", "pt": "Depto. 08 · Recursos Humanos"}, "title": {"en": "Jarred heads and staff files", "pt": "Cabeças no pote e fichas funcionais"}, "lede": {"en": "Saw a creature with an empty jar in your off hand and you keep its head, with everything it was. HR gives it a number, a name, a department and a job title.", "pt": "Serre uma criatura com um pote vazio na outra mão e a cabeça fica com você, com tudo o que ela era. O RH dá a ela uma matrícula, um nome, um departamento e um cargo."}, "points": [{"en": "A placed head turns to watch you. A jarred villager still trades, restocks, and nods at each deal.", "pt": "Uma cabeça pousada acompanha você com os olhos. Um aldeão no pote continua negociando, repõe o estoque e acena a cada troca."}, {"en": "Ring its bell and it says something in its own noise. HR adds a translation; the cow wants to know if there is a canteen.", "pt": "Toque a campainha e ela fala alguma coisa na própria língua. O RH traduz; a vaca quer saber se tem cantina."}, {"en": "Every creature the company touches gets a staff number and a Personnel File, and Jade shows them.", "pt": "Toda criatura em que a empresa encosta ganha uma matrícula e uma Ficha Funcional, e o Jade mostra as duas."}, {"en": "Pay a head its wage by hand once and from then on it takes the next one from a chest beside it every dawn. Morale goes up when it's paid and down when it isn't.", "pt": "Pague o salário de uma cabeça à mão uma vez e, a partir daí, ela mesma tira o próximo de um baú ao lado a cada amanhecer. A moral sobe quando ela recebe e cai quando não recebe."}, {"en": "Feed a head Nutrient Broth and it does a desk job. The cat keeps creepers away. The warden logs every noise. The ghast weeps the odd Ghast Tear, nothing personal.", "pt": "Dê Caldo Nutritivo a uma cabeça e ela faz um trabalho de escritório. O gato espanta creepers. O warden anota cada barulho. O ghast chora uma Lágrima de Ghast de vez em quando, nada pessoal."}, {"en": "When a host or a worker dies, its employer gets an Exit Interview and a Condolence Card.", "pt": "Quando um hospedeiro ou um funcionário morre, o empregador recebe uma Entrevista de Desligamento e um Cartão de Condolências."}], "memo": {"key": "memo.headinajar.staff_number", "speaker": {"en": "Memo from DOLORES", "pt": "Memorando da DOLORES"}, "placeholders_filled": true, "en": "Staff No. 0001 (Cow) has been entered in the register. We do not lose staff. We occasionally misplace them.", "pt": "O funcionário Nº 0001 (Vaca) entrou no cadastro. Nós não perdemos funcionários. Às vezes os extraviamos."}, "media": [{"file": "heads_rung.gif", "alt": {"en": "Walking along a row of placed heads on a stone ledge and ringing each with an empty hand: a chicken, a cow, a creeper, a blaze and a ghast in turn say a line over the jar (\"Moo. Is there a canteen?\", \"Fwoosh. I run hot. It is in my appraisal.\", the ghast \"Ooooooh. It is a snug fit.\"), the same line on the action bar, and Jade at the top right gives each one's title: Timekeeper, Canteen Supervisor, Demolition (Probationary), Heating, Grief Counsellor", "pt": "Andando ao longo de uma fileira de cabeças colocadas numa saliência de pedra e tocando cada uma com a mão vazia: uma galinha, uma vaca, um creeper, um blaze e um ghast dizem, um de cada vez, uma frase sobre o pote (\"Muu. Tem cantina aqui?\", \"Fuuush. Sou esquentado. Está na minha avaliação.\", o ghast \"Uuuuuuh. Coube. O RH chama de aconchegante.\"), a mesma frase na barra de ação, e o Jade, no canto superior direito, dá o cargo de cada uma: Controle de Ponto, Supervisora da Cantina, Demolição (Em Experiência), Aquecimento, Apoio ao Luto"}, "tags": ["staff"], "caption": {"en": "Ringing down the row: chicken, cow, creeper, blaze, ghast. HR translates.", "pt": "Tocando a fileira inteira: galinha, vaca, creeper, blaze, ghast. O RH traduz."}}, {"file": "jarred_head.gif", "alt": {"en": "A placed jarred villager head in its jar turning to follow a player who walks past behind it, comes round beside it and rings it; it answers over the jar: \"Hrm. Is that a jar?\"", "pt": "Uma cabeça de aldeão colocada, no seu pote, girando para acompanhar um jogador que passa atrás dela, dá a volta até ficar ao lado e toca a campainha; ela responde sobre o pote: \"Hrm. Isso é um pote?\""}, "tags": ["staff", "jar"], "caption": {"en": "A jarred villager keeping an eye on you.", "pt": "Um aldeão no pote de olho em você."}}, {"file": "ghast_tear.gif", "alt": {"en": "A fed ghast head in its jar at dawn: \"The Grief Counsellor has produced a tear. Nothing personal.\" appears over the jar, a Ghast Tear drops down the front of the plinth to its foot by the bowl, green sparkles of the dawn's pay rise, and the subtitles read \"Ghast head weeps\" and \"Pay clinks into tray\"", "pt": "Uma cabeça de ghast alimentada no pote, ao amanhecer: \"O Apoio ao Luto produziu uma lágrima. Não é pessoal.\" aparece sobre o pote, uma Lágrima de Ghast desce pela frente do pedestal até o pé dele, junto à tigela, sobem os brilhos verdes do pagamento do amanhecer, e as legendas dizem \"Cabeça de ghast chora\" e \"Pagamento tilinta na bandeja\""}, "tags": ["staff"], "caption": {"en": "The Grief Counsellor's first tear, at dawn.", "pt": "A primeira lágrima do Apoio ao Luto, ao amanhecer."}}, {"file": "slime_executive.png", "alt": {"en": "A size-4 slime sawn whole into an Executive Life Support Jar and set down on its plinth: the green cube floats in the middle of the saline, its face to you, the plinth's empty bowl and spoon at its front corner", "pt": "Um slime de tamanho 4 serrado inteiro para dentro de um Pote de Suporte Vital Executivo e colocado no pedestal: o cubo verde flutua no meio do soro, de frente para você, com a tigela vazia e a colher do pedestal no canto da frente"}, "tags": ["staff", "jar"], "caption": {"en": "A whole slime, sawn into an Executive jar.", "pt": "Um slime inteiro, serrado para dentro de um pote Executivo."}}]}, {"id": "board-of-directors", "dept_label": {"en": "Dept. 09 · Board of Directors", "pt": "Depto. 09 · Conselho de Administração"}, "title": {"en": "Heads at work", "pt": "Cabeças no trabalho"}, "lede": {"en": "A head is too valuable to waste. Fit a jarred head to the right company block and it finds work there.", "pt": "Uma cabeça é valiosa demais para ser desperdiçada. Encaixe uma cabeça no pote no bloco certo da empresa e ela arruma trabalho ali."}, "points": [{"en": "On a Turret Pedestal, a head guards 16 blocks the way its mob used to fight: a skeleton shoots arrows, a blaze throws fireballs.", "pt": "Num Pedestal de Torreta, a cabeça guarda 16 blocos do jeito que a criatura lutava: o esqueleto atira flechas, o blaze joga bolas de fogo."}, {"en": "Any other head makes a Lookout. It raises its species' alarm and lights a comparator.", "pt": "Qualquer outra cabeça vira Vigia. Dá o alarme da própria espécie e acende um comparador."}, {"en": "Cerebral Array: up to nine heads make FE by thinking very hard about broth. Five or more hold a Board Meeting, and vote.", "pt": "Matriz Cerebral: até nove cabeças geram FE de tanto pensar em caldo. Com cinco ou mais, há Reunião do Conselho, com votação."}, {"en": "Hang a jarred villager on a machine with an Employee Mount, pay it an emerald a day, and the machine works better.", "pt": "Pendure um aldeão no pote numa máquina com um Suporte de Funcionário, pague uma esmeralda por dia, e a máquina trabalha melhor."}, {"en": "Neural Socket: plug in as a jar and drive six redstone channels, or let a zombie head tick as a clock.", "pt": "Soquete Neural: conecte-se como pote e comande seis canais de redstone, ou deixe uma cabeça de zumbi fazer tique-taque como relógio."}], "memo": {"key": "array.headinajar.vote", "speaker": {"en": "The Board", "pt": "O Conselho"}, "placeholders_filled": true, "en": "[Board Meeting] Motion: dental cover. Carried 4 to 1.", "pt": "[Reunião do Conselho] Moção: plano odontológico. Aprovada por 4 a 1."}, "media": [{"file": "turret_pedestal.gif", "alt": {"en": "A Turret Pedestal with a blaze head in its jar swinging round as a zombie in an iron helmet stands nearby, a flame flaring over the jar", "pt": "Um Pedestal de Torreta com uma cabeça de blaze no pote girando enquanto um zumbi de capacete de ferro está por perto, uma chama acendendo sobre o pote"}, "tags": ["staff", "machines"], "caption": {"en": "A blaze head on guard duty. A Turret Pedestal needs a jarred mob head and power.", "pt": "Uma cabeça de blaze de plantão. O Pedestal de Torreta precisa de uma cabeça de criatura no pote e de energia."}}, {"file": "lookout.gif", "alt": {"en": "Two Turret Pedestals with a Galvanic Pile between them, a comparator and a redstone lamp behind the left one: a zombie walks in from far off, the cow Lookout says \"Moo! Intruder at the canteen.\" over its jar, the zombie glows and the lamp lights; the skeleton head beside it shoots until the zombie falls, and the lamp goes out", "pt": "Dois Pedestais de Torreta com uma Pilha Galvânica entre eles, um comparador e uma lâmpada de redstone atrás do da esquerda: um zumbi chega de longe, o Vigia vaca diz \"Muu! Intruso na cantina.\" sobre o pote, o zumbi brilha e a lâmpada acende; a cabeça de esqueleto ao lado atira até o zumbi cair, e a lâmpada apaga"}, "tags": ["staff", "machines"], "caption": {"en": "The cow raises the alarm and the skeleton head next door does the shooting.", "pt": "A vaca dá o alarme e a cabeça de esqueleto ao lado cuida dos tiros."}}, {"file": "cerebral_array.gif", "alt": {"en": "A Cerebral Array with its rack of nine heads (a pig's and a creeper's among them) in their small jars, the gavel on top lifting and dropping", "pt": "Uma Matriz Cerebral com seu rack de nove cabeças (entre elas a de um porco e a de um creeper) em potinhos, o martelo no topo subindo e descendo"}, "tags": ["staff", "machines"], "caption": {"en": "A fed Cerebral Array at work, the chairman's gavel lifting.", "pt": "Uma Matriz Cerebral alimentada trabalhando, o martelo do presidente subindo."}}, {"file": "employee_mount.gif", "alt": {"en": "An Employee Mount seen from its own side: payday, an emerald on the tray with green sparkles", "pt": "Um Suporte de Funcionário visto de lado: dia de pagamento, uma esmeralda na bandeja com brilhos verdes"}, "tags": ["staff", "machines"], "caption": {"en": "Payday. One emerald, from the chest next door.", "pt": "Dia de pagamento. Uma esmeralda, do baú ao lado."}}, {"file": "neural_socket.gif", "alt": {"en": "A jar plugged into a Neural Socket: the channel bars on its sides and bands light and change as its outputs are set", "pt": "Um pote conectado a um Soquete Neural: as barras de canal nas laterais e as faixas acendem e mudam conforme as saídas são ajustadas"}, "tags": ["staff", "machines", "jar"], "caption": {"en": "Plugged in. As a jar, Use the Neural Socket.", "pt": "Conectado. Como pote, use o Soquete Neural."}}]}, {"id": "mecha-division", "dept_label": {"en": "Dept. 10 · Senior Management", "pt": "Depto. 10 · Alta Diretoria"}, "title": {"en": "Mecha Division", "pt": "Divisão de Mechas"}, "lede": {"en": "A jar on its own is a modest career. A jar in a mecha is senior management.", "pt": "Um pote sozinho é uma carreira modesta. Um pote num mecha é alta diretoria."}, "points": [{"en": "Put a frame and its modules in the Assembly Gantry and press Assemble. The mecha builds itself on the pad while the arm welds each part home.", "pt": "Ponha uma estrutura e os módulos no Pórtico de Montagem e aperte Montar. O mecha se monta sozinho na plataforma enquanto o braço solda cada peça no lugar."}, {"en": "Eight frames, from the pogoing Hopper to the Executive. Each does something of its own when you press Drive.", "pt": "Oito estruturas, do Saltador pula-pula ao Executivo. Cada uma faz algo próprio quando você aperta a tecla Rodinhas."}, {"en": "58 modules in six kinds: legs, jets, cores, armour, arms from a drill to a Plasma Lance, and sensors.", "pt": "58 módulos em seis tipos: pernas, jatos, núcleos, blindagem, braços de uma broca a uma Lança de Plasma, e sensores."}, {"en": "Mind the battery, heat and mass. Run it hot and it vents steam; overload it and the servos lock.", "pt": "Cuide da bateria, do calor e da massa. Esquentou demais, ele solta vapor; sobrecarregou, os servos travam."}, {"en": "A Cargo Hold, passenger seats and Gene Ports. Dents show where it was hit, and Mecha Plating patches it.", "pt": "Compartimento de Carga, assentos de passageiro e Portas Genéticas. Os amassados mostram onde apanhou, e a Placa de Mecha remenda."}, {"en": "Under 10% health the Golden Parachute fires your jar clear, and a letter follows.", "pt": "Abaixo de 10% da vida, o Paraquedas Dourado dispara o seu pote para longe, e uma carta vem em seguida."}], "memo": {"key": "refusal.headinajar.mecha.siege.fluid", "speaker": {"en": "Colossus, kneeling for Siege", "pt": "Colosso, ajoelhando para o Cerco"}, "en": "Planning refuses a site under water. Find dry ground.", "pt": "O Planejamento recusa obra na água. Ache chão seco."}, "media": [{"file": "gantry_build.gif", "alt": {"en": "From the front-right, a Bulwark unfolds itself on the Assembly Gantry's turntable while the Gantry's arm reaches in to weld each part home; the turntable turns it round and it stands finished, the arm standing off beside it", "pt": "Pela frente e à direita, um Baluarte se desdobra sozinho no prato giratório do Pórtico de Montagem enquanto o braço do Pórtico avança para soldar cada peça no lugar; o prato o gira e ele fica de pé, pronto, com o braço afastado ao lado"}, "tags": ["mecha", "machines"], "caption": {"en": "A Bulwark assembling itself. The arm does the welding.", "pt": "Um Baluarte se montando sozinho. O braço cuida da solda."}}, {"file": "golden_parachute.gif", "alt": {"en": "From the side, a Hopper takes a last hit and flashes red; the jar is fired up out of its hoop, a gold canopy opens over it, and it drifts down to land beside the empty machine", "pt": "De lado, um Saltador leva um último golpe e pisca em vermelho; o pote é disparado para cima para fora do aro, um dossel dourado se abre sobre ele, e ele desce flutuando até pousar ao lado da máquina vazia"}, "tags": ["mecha"], "caption": {"en": "The Golden Parachute fires by itself when a hit leaves a piloted mecha under 10% health.", "pt": "O Paraquedas Dourado dispara sozinho quando um golpe deixa um mecha pilotado com menos de 10% da vida."}}, {"file": "plasma_lance.gif", "alt": {"en": "From behind and to one side, a Hopper raises its arm and a thin copper beam runs from the lance's tip to a cow, which catches fire; the beam cuts out and the cow burns on", "pt": "Por trás e de lado, um Saltador ergue o braço e um feixe fino de cobre vai da ponta da lança até uma vaca, que pega fogo; o feixe se apaga e a vaca continua queimando"}, "tags": ["mecha"], "caption": {"en": "A Plasma Lance. Hold the arm's button and the beam follows your aim.", "pt": "Uma Lança de Plasma. Segure o botão do braço e o feixe segue a sua mira."}}, {"file": "limp.gif", "alt": {"en": "From the front, a Bulwark dented along its left flank limps towards you, its left boot dragging and its left arm hanging", "pt": "Pela frente, um Baluarte amassado ao longo do flanco esquerdo vem mancando na sua direção, arrastando a bota esquerda e com o braço esquerdo caído"}, "tags": ["mecha"], "caption": {"en": "Dents show where a mecha was hit. This one was hit on the left.", "pt": "Os amassados mostram onde o mecha apanhou. Este apanhou do lado esquerdo."}}, {"file": "mecha_row.png", "alt": {"en": "All eleven standing on the grass in three ranks, fronts to the camera: at the back the Executive, Colossus and Wheelhouse; in the middle the Kite, Skitter, Chimera and Bulwark; in front the Spider Walker, Rover, Lunk and Hopper", "pt": "Os onze de pé na grama em três fileiras, de frente para a câmera: atrás o Executivo, o Colosso e a Casa sobre Rodas; no meio a Pipa, o Rastejador, a Quimera e o Baluarte; na frente o Andador Aranha, o Rover, o Brutamontes e o Saltador"}, "tags": ["mecha"], "caption": {"en": "Eight frames and three shells, posed for the annual report.", "pt": "Oito estruturas e três cascos, posando para o relatório anual."}}]}, {"id": "genetics", "dept_label": {"en": "Dept. 11 · Research", "pt": "Depto. 11 · Pesquisa"}, "title": {"en": "Genetics Department", "pt": "Departamento de Genética"}, "lede": {"en": "Genetics borrows what other creatures are good at and puts it into you, your hosts and your mecha. It takes a syringe, four machines and a cooperative cow.", "pt": "A Genética pega emprestado o que outras criaturas fazem bem e põe em você, nos seus hospedeiros e nos seus mechas. Basta uma seringa, quatro máquinas e uma vaca colaborativa."}, "points": [{"en": "Draw a Blood Sample with a syringe, or let a Leech Jar farm them. No sample costs a specimen its life.", "pt": "Tire uma Amostra de Sangue com uma seringa, ou deixe um Pote de Sanguessugas fazer a coleta. Nenhuma amostra custa a vida do espécime."}, {"en": "The Centrifuge spins it into a DNA Fraction. The DNA Sequencer reads it into your gene library, better if you call the bases yourself.", "pt": "A Centrífuga transforma a amostra numa Fração de DNA. O Sequenciador de DNA a lê para a sua biblioteca de genes, e lê melhor se você mesmo ditar as bases."}, {"en": "The Gene Splicer stitches up to three genes into a serum. Watch the stability and the load, because mutations happen.", "pt": "O Emendador de Genes costura até três genes num soro. Fique de olho na estabilidade e na carga, porque mutações acontecem."}, {"en": "Inject your own body at the Injection Rig, or a host or a mecha by hand.", "pt": "Injete no seu próprio corpo na Estação de Injeção, ou num hospedeiro ou num mecha à mão."}, {"en": "89 genes, and every natural vanilla creature carries at least one. Ruminant Gut fills you up, and you moo when hurt.", "pt": "89 genes, e toda criatura vanilla natural carrega pelo menos um. A Pança Ruminante mata a fome por mais tempo, e você muge quando se machuca."}, {"en": "The Staff Directory stamps every species your team samples, jars or rides.", "pt": "O Cadastro de Pessoal carimba cada espécie que sua equipe amostra, põe no pote ou monta."}], "memo": {"key": "memo.headinajar.cow_apology", "speaker": {"en": "Memo from DOLORES", "pt": "Memorando da DOLORES"}, "en": "Following a review, the cow has been found to carry genes after all. HR apologises to the cow.", "pt": "Após revisão, constatou-se que a vaca carrega genes, sim. O RH pede desculpas à vaca."}, "media": [{"file": "cow_gene.gif", "alt": {"en": "A Syringe jabbed into a cow: the toast \"Advancement Made! An Apology to the Cow\" and DOLORES's memo \"Following a review, the cow has been found to carry genes after all. HR apologises to the cow.\"; the sample spins in a Centrifuge beside the cow; a DNA Sequencer reads its fraction (\"Ruminant Gut 0%\", \"Reading...\") and the next cow fraction shows \"Ruminant Gut 8%\"", "pt": "Uma Seringa espetada numa vaca: o aviso \"Progresso alcançado! Desculpas à Vaca\" e o memorando da DOLORES \"Após revisão, constatou-se que a vaca carrega genes, sim. O RH pede desculpas à vaca.\"; a amostra gira numa Centrífuga ao lado da vaca; um Sequenciador de DNA lê a fração (\"Pança Ruminante 0%\", \"Lendo...\") e a fração de vaca seguinte mostra \"Pança Ruminante 8%\""}, "tags": ["genetics"], "caption": {"en": "One cow, sampled, spun and read. Ruminant Gut is now on file.", "pt": "Uma vaca amostrada, centrifugada e lida. A Pança Ruminante já está no cadastro."}}, {"file": "leech_jar.gif", "alt": {"en": "A Leech Jar seen from the front, a cow behind it flashing red as a sample is drawn, the crank turning", "pt": "Um Pote de Sanguessugas visto de frente, com uma vaca atrás piscando em vermelho enquanto uma amostra é tirada e a manivela girando"}, "tags": ["genetics", "machines"], "caption": {"en": "A Leech Jar takes a sample from the cow beside it every 30 seconds, unsupervised.", "pt": "O Pote de Sanguessugas tira uma amostra da vaca ao lado a cada 30 segundos, sem supervisão."}}, {"file": "centrifuge.gif", "alt": {"en": "A Centrifuge spinning, its four hangers swinging out under the striped canopy", "pt": "Uma Centrífuga girando, os quatro suportes se abrindo para fora sob a cobertura listrada"}, "tags": ["genetics", "machines"], "caption": {"en": "Blood Samples in, DNA Fractions out.", "pt": "Entram Amostras de Sangue, saem Frações de DNA."}}, {"file": "gene_splicer.gif", "alt": {"en": "A Gene Splicer at work: the wheel turning and the needle stitching", "pt": "Um Emendador de Genes trabalhando: o volante girando e a agulha costurando"}, "tags": ["genetics", "machines"], "caption": {"en": "Pick the genes, load gel and a bottle, press Splice.", "pt": "Escolha os genes, ponha o gel e uma garrafa, aperte Emendar."}}, {"file": "staff_directory.gif", "alt": {"en": "The DNA Sequencer's Directory tab: \"Staff Directory, 2 of 77 on file\", rows of spawn eggs under Livestock, Field Office, Logistics, Security and Night Shift, the sampled cow and pig undimmed with their stamps; pointing at the blank Mooshroom and Sheep cells shows where they live, the jar they want, their blood, the tool and their genes at 0% read; scrolled down, the blank Stray cell says \"Found near: snowy plains, ice spikes and frozen places. Any jar. Marrow Drill, not a syringe.\"", "pt": "A aba Cadastro de Pessoal do Sequenciador de DNA: \"Cadastro de Pessoal, 2 de 77 cadastrados\", fileiras de ovos geradores sob Pecuária, Trabalho de Campo, Logística, Segurança e Turno da Noite, com a vaca e o porco já amostrados sem esmaecer e com seus carimbos; apontar para as células em branco da Mooshroom e da Ovelha mostra onde vivem, o pote que pedem, o sangue, a ferramenta e os genes com 0% lido; mais abaixo, a célula em branco do Errante diz \"Onde achar: planícies nevadas, picos de gelo e o gelo. Qualquer pote. Broca de Medula, não seringa.\""}, "tags": ["genetics"], "caption": {"en": "The Staff Directory. Point at a blank cell to see where the creature lives and what to draw its blood with.", "pt": "O Cadastro de Pessoal. Aponte para uma célula em branco para ver onde a criatura vive e com o que tirar o sangue dela."}}]}, {"id": "workforce", "dept_label": {"en": "Dept. 12 · Staffing", "pt": "Depto. 12 · Pessoal"}, "title": {"en": "The workforce", "pt": "A força de trabalho"}, "lede": {"en": "Not every hire needs the chair. Living creatures, heads still on, can be hired with a lanyard and put to work at a Time Clock. HR switches their own minds off for the duration.", "pt": "Nem toda contratação passa pela cadeira. Criaturas vivas, com a cabeça no lugar, podem ser contratadas com um crachá e postas para trabalhar num Relógio de Ponto. O RH desliga a mente delas durante o expediente."}, "points": [{"en": "Hire a creature with a Staff Lanyard. Hostile candidates need wearing down to half their health first.", "pt": "Contrate uma criatura com o Crachá de Funcionário. Candidatos hostis precisam apanhar até a metade da vida antes."}, {"en": "A Time Clock is a site of its own, with a roster, a job rack, a pay drawer and shifts. Staff queue up to punch in.", "pt": "Um Relógio de Ponto é um local de trabalho completo, com quadro de pessoal, quadro de tarefas, gaveta de pagamento e turnos. Os funcionários fazem fila para bater o ponto."}, {"en": "Hand out work with the Clipboard and Job Cards: Hauling, Sorting, Farming or Security. Every species has its own talents.", "pt": "Distribua o trabalho com a Prancheta e os Cartões de Tarefa: Transporte, Triagem, Lavoura ou Segurança. Cada espécie tem seus talentos."}, {"en": "Undead staff in a Hard Hat can work the Day shift without catching fire.", "pt": "Funcionários mortos-vivos de Capacete de Obra trabalham no turno do Dia sem pegar fogo."}, {"en": "Blow the Supervisor's Whistle and a detail of up to six follows you and goes for whatever you point at.", "pt": "Sopre o Apito do Supervisor e uma equipe de até seis segue você e parte para cima do que você apontar."}, {"en": "Quirks come with the species. An enderman stops when stared at, a piglin pockets the odd item, and an unpaid llama spits.", "pt": "As manias vêm com a espécie. O enderman trava quando encarado, o piglin embolsa um item ou outro, e a lhama sem salário cospe."}], "memo": {"key": "refusal.headinajar.lanyard.village_golem", "speaker": {"en": "Staff Lanyard", "pt": "Crachá de Funcionário"}, "en": "Already employed by the village. We do not poach from the public sector.", "pt": "Já trabalha para a vila. Não roubamos gente do setor , fazem fila na frente dele e sobem um de cada vez para bater o ponto, e cada um sai com seu cartão até um baú; depois, de perto, sob um céu cor-de-rosa, um zumbi atrasado se aproxima, o cartão entra na fenda e a alavanca é puxada"}, "tags": ["staff"], "caption": {"en": "Dusk, and the night shift queues to punch in.", "pt": "Fim de tarde, e o turno da noite faz fila para bater o ponto."}}]}, {"id": "secondment", "dept_label": {"en": "Dept. 13 · Internal Mobility", "pt": "Depto. 13 · Mobilidade Interna"}, "title": {"en": "Secondment", "pt": "Destacamento"}, "lede": {"en": "Staff with excellent minds and no body may be seconded to a body with no mind. A Secondment Collar seats a jarred mob head on a host, and the pair works for you.", "pt": "Funcionários de mente excelente e sem corpo podem ser destacados para um corpo sem mente. Uma Coleira de Destacamento encaixa uma cabeça de criatura no pote num hospedeiro, e a dupla trabalha para você."}, "points": [{"en": "Collar a host, then seat a jarred head on it. The head brings the skills and the body brings the legs.", "pt": "Ponha a coleira num hospedeiro e encaixe nele uma cabeça no pote. A cabeça traz o talento e o corpo traz as pernas."}, {"en": "A skeleton head on a spider body climbs the wall and shoots from the top.", "pt": "Uma cabeça de esqueleto num corpo de aranha sobe o muro e atira lá de cima."}, {"en": "Team sync grows with the work. The body's traits come at 25%, its Ability at 50%, and Team Spirit at 100%.", "pt": "A sincronia de equipe cresce com o trabalho. As características do corpo chegam a 25%, a Habilidade a 50% e o Espírito de Equipe a 100%."}, {"en": "The collar's canister drinks Nutrient Broth, topped up from the Time Clock at each punch-in.", "pt": "O cilindro da coleira bebe Caldo Nutritivo, reabastecido pelo Relógio de Ponto a cada batida de ponto."}, {"en": "When the body dies, the Redundancy Package floats the head down under a tiny gold canopy. Its file and grade are kept.", "pt": "Quando o corpo morre, o Pacote de Demissão desce com a cabeça sob um velame dourado minúsculo. A ficha e o nível ficam preservados."}, {"en": "DOLORES has something to say about sixteen famous pairings, once each.", "pt": "A DOLORES tem um comentário para dezesseis duplas famosas, uma vez cada."}], "memo": {"key": "refusal.headinajar.secondment.second_head", "speaker": {"en": "Secondment Collar", "pt": "Coleira de Destacamento"}, "en": "One head per body. HR is very clear.", "pt": "Uma cabeça por corpo. O RH foi bem claro."}, "media": [{"file": "secondment_climb.gif", "alt": {"en": "From beside a six-block stone-brick wall, a headless spider with a skeleton head in a jar on its brass collar climbs the wall's face to the top and stands on it, shooting arrows down at a creeper walking across the grass below; the creeper flashes red at each hit as it comes on toward the camera", "pt": "Ao lado de um muro de tijolos de pedra de seis blocos, uma aranha sem cabeça com uma cabeça de esqueleto num pote na coleira de latão escala a face do muro até o topo e fica em cima dele, atirando flechas num creeper que atravessa a grama lá embaixo; o creeper pisca em vermelho a cada acerto enquanto avança em direção à câmera"}, "tags": ["bodies", "staff"], "caption": {"en": "A skeleton head seconded to a spider, working from the top of the wall.", "pt": "Uma cabeça de esqueleto destacada para uma aranha, trabalhando do alto do muro."}}, {"file": "redundancy_package.gif", "alt": {"en": "A headless ravager with a zombie head in a jar on its collar stands on a stone ledge six blocks up beside its employer; struck, it falls, and the jar shoots up from its neck under a small gold canopy, drifts down the face of the ledge and lands at its foot as a placed jarred head, the canopy folding beside it; then Jade on the placed head shows its file: Jarred Head, Title: Clerk, No. 0002, Night Shift, Dev's staff, Nigel (Zombie)", "pt": "Um devastador sem cabeça com uma cabeça de zumbi num pote na coleira está ionário"}, "en": "A pizza party is not a pay rise.", "pt": "Festa da pizza não é aumento."}]}, "download": {"headline": {"en": "Your desk is ready.", "pt": "Sua mesa está pronta."}, "text": {"en": "Head in a Jar is a Minecraft mod for NeoForge 1.21.1, fully playable in English and Brazilian Portuguese: every line of text, the handbook, the advancements and DOLORES's voice. Install it on both the client and the server.", "pt": "Head in a Jar é um mod de Minecraft para NeoForge 1.21.1, totalmente jogável em inglês e português do Brasil: cada linha de texto, o manual, as conquistas e a voz da DOLORES. Instale no cliente e no servidor."}, "requirements_title": {"en": "Requirements", "pt": "Requisitos"}, "requirements": [{"en": "Minecraft 1.21.1 with NeoForge 21.1.200 or newer.", "pt": "Minecraft 1.21.1 com NeoForge 21.1.200 ou mais recente."}, {"en": "GeckoLib 4.9.3 or a newer 4.x for 1.21.1 (required; GeckoLib 5 is not accepted).", "pt": "GeckoLib 4.9.3 ou uma 4.x mais recente para 1.21.1 (obrigatório; o GeckoLib 5 não é aceito)."}, {"en": "Install it on both the client and the server.", "pt": "Instale no cliente e no servidor."}], "optional_title": {"en": "Plays nicely with", "pt": "Funciona bem com"}, "optional_lede": {"en": "None of these is needed. Each one switches on only when its mod is installed.", "pt": "Nenhum é obrigatório. Cada integração só liga quando o mod está instalado."}, "optional_mods": [{"name": "JEI", "text": {"en": "An information page for every machine and most of the company's items.", "pt": "Uma página de informações para cada máquina e para a maioria dos itens da empresa."}}, {"name": "Jade", "text": {"en": "A mecha's battery and heat, a host's freshness and sync, your set-down head's saline and glass, genes, and staff files.", "pt": "Bateria e calor de um mecha, frescor e sincronia de um hospedeiro, soro e vidro da sua cabeça pousada, genes e fichas funcionais."}}, {"name": "Curios", "text": {"en": "Wear the Head Satchel in the belt slot.", let ALL = [];
function film(m, cls = "", opts = {}) {
  const i = ALL.push(m) - 1;
  const s = stem(m.file), isGif = m.file.endsWith(".gif"), snd = SOUND[s];
  const alt = t(SOUND[stem(m.file)]?.alt || m.alt);
  let inner;
  if (snd) {
    inner = `<video data-sound="${esc(snd.file)}" src="m/sound/${esc(snd.file)}" poster="m/sound/${esc(snd.poster)}" preload="none" playsinline muted loop aria-label="${alt}"></video>
      <button type="button" class="snd" data-snd aria-label="${ui("play_with_sound")}">${ICON_SND}<span>${ui("play_with_sound")}</span></button><span class="badge">${ui("sound_on")}</span>`;

    inner = `<video data-loop src="m/loop/${esc(s)}.mp4" poster="m/poster/${esc(s)}.jpg" preload="none" playsinline muted loop aria-label="${alt}"></video>`;
  } else {
    inner = `<img src="m/img/${esc(m.file)}" alt="${alt}" loading="lazy">`;
  }
  const dm = DIMS[s]; if (dm && dm[1] / dm[0] > 0.7 && !snd) cls += " tall";
  return `<figure class="film ${cls}" data-i="${i}" data-tags="${esc((m.tags || []).join(" "))}${snd ? " sound" : ""}">${inner}

  wire();
}

// ---- behaviour ----
let io;
function wire() {
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target;
    if (e.isIntersecting) { if (!reduce && (v.hasAttribute("data-loop") || (v.dataset.sound && v.muted))) { v.play().catch(() => {}); } }
    else if (!v.paused) { v.pause(); }
  }), { rootMargin: "200px 0px" });
  document.querySelectorAll("#main video").forEach(v => io.observe(v));

  document.querySelectorAll("#main .film").forEach(f => {
    f.querySelector(".open").addEventListener("click", () => openLb(+f.dataset.i, f));
    const b = f.querySelector("[data-snd]");
    if (b) b.addEventListener("click", ev => { ev.stopPropagation(); toggleSound(f.querySelector("video"), b); });
  });

  const wall = document.getElementById("wall");
  document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    const k = b.dataset.f; let shown = 0;
    wall.querySelectorAll(".film").forEach(f => { const on = k === "all" || f.dataset.tags.split(" ").includes(k); f.hidden = !on; if (on) shown++; });
    document.getElementById("empty").hidden = shown > 0;
  }));
}

function toggleSound(v, b) {
  const turningOn = v.muted || v.paused;
  document.querySelectorAll("#main video[data-sound]").forEach(o => { if (o !== v && !o.muted) { o.muted = true; const ob = o.parentElement.querySelector("[data-snd]"); if (ob) { ob.innerHTML = ICON_SND + "<span>" + ui("play_with_sound") + "</span>"; ob.setAttribute("aria-label", T(DATA.ui.play_with_sound)); } } });
  if (turningOn) { v.muted = false; v.currentTime = 0; v.play().catch(() => {}); b.innerHTML = ICON_MUTE + "<span>" + ui("mute") + "</span>"; b.setAttribute("aria-label", T(DATA.ui.mute)); }
  else { v.muted = true; b.innerHTML = ICON_SND + "<span>" + ui("play_with_sound") + "</span>"; b.setAttribute("aria-label", T(DATA.ui.play_with_sound)); }
}

// lightbox
const lb = document.getElementById("lb"); let lbIdx = 0, lbGroup = [];
function openLb(i, fig) {
  const scope = fig.closest("#wall") ? [...document.querySelectorAll("#wall .film:not([hidden])")] : [...document.querySelectorAll("#main .film:not(#wall .film)")];
  lbGroup = scope.map(f => +f.dataset.i); lbIdx = Math.max(0, lbGroup.indexOf(i));
  document.querySelectorAll("#main video[data-sound]").forEach(o => { o.muted = true; });
  showLb(); if (!lb.open) lb.showModal();
}
function showLb() {
  const m = ALL[lbGroup[lbIdx]]; const s = stem(m.file), snd = SOUND[s];
  const stage = document.getElementById("lbStage");
  if (snd) stage.innerHTML = `<video src="m/sound/${esc(snd.file)}" poster="m/sound/${esc(snd.poster)}" controls autoplay playsinline></video>`;
  else if (m.file.endsWith(".gif")) stage.innerHTML = `<video src="m/loop/${esc(s)}.mp4" poster="m/poster/${esc(s)}.jpg" ${reduce ? "controls" : "autoplay"} muted loop playsinline aria-label="${t(m.alt)}"></video>`;
  else stage.innerHTML = `<img src="m/img/${esc(m.file)}" alt="${t(m.alt)}">`;
  document.getElementById("lbCap").textContent = T(cap(m)) || T(m.alt);
}
document.getElementById("lbPrev").onclick = () => { lbIdx = (lbIdx - 1 + lbGroup.length) % lbGroup.length; showLb(); };
document.getElementById("lbNext").onclick = () => { lbIdx = (lbIdx + 1) % lbGroup.length; showLb(); };
document.getElementById("lbClose").onclick = () => lb.close();
lb.addEventListener("close", () => { document.getElementById("lbStage").innerHTML = ""; });
lb.addEventListener("keydown", e => { if (e.key === "ArrowLeft") document.getElementById("lbPrev").click(); if (e.key === "ArrowRight") document.getElementById("lbNext").click(); });
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });

document.querySelectorAll("#lang button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return; lang = b.dataset.lang;
  try { localStorage.setItem("headinajar-lang", lang); } catch (e) {}
  const y = scrollY; render(); scrollTo(0, y);
}));

render();
</script>
</body>
