<style>
/* Layout: Noggin & Sons' recruitment brochure. Ink cover and paper pages alternate; every feature is a department
   with its own dossier: label, title, a lead film and a contact strip, the facts as a numbered list, a memo slip. */
:root {
  --ink: #14171a; --ink-2: #1d2125; --ink-rule: #30363c; --ink-text: #d8dcd6; --ink-muted: #98a29f;
  --paper: #e9ece6; --paper-2: #f6f7f3; --paper-rule: #c9cec5; --text: #14171a; --muted: #4f5753;
  --brass: #c59a4e; --brass-deep: #7d5a1e; --teal: #2b6b6f; --teal-light: #84c6c1; --stamp: #b23a2e; --stamp-light: #e57766;
  --display: "Archivo", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --wrap: 1240px; --radius: 4px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--paper); color: var(--text); font: 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ink); }
img, video { max-width: 100%; display: block; }
a { color: var(--teal); }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
@media (max-width: 600px) { .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 16px; top: 16px; z-index: 50; background: var(--brass); color: var(--ink); padding: 10px 14px; }

.eyebrow { margin: 0; font: 500 12px/1.3 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--teal); }
.ink .eyebrow { color: var(--teal-light); }
.display { margin: 0; font-family: var(--display); font-weight: 900; font-stretch: 70%; text-transform: uppercase; line-height: .94; letter-spacing: -.005em; text-wrap: balance; }
@media (max-width: 600px) { .display { overflow-wrap: break-word; hyphens: auto; } }
.h2 { font-size: clamp(40px, 6vw, 68px); }
.h3 { font-size: clamp(30px, 3.6vw, 44px); line-height: 1; }
.lede { margin: 0; font-size: clamp(17px, 1.5vw, 19px); line-height: 1.6; max-width: 36em; color: var(--muted); }
.ink { background: var(--ink); color: #f1f2ee; }
.ink .lede { color: var(--ink-text); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: var(--radius);
  font: 800 15px/1 var(--display); letter-spacing: .07em; text-transform: uppercase; text-decoration: none; border: 1px solid transparent; cursor: pointer; }
.btn-brass { background: var(--brass); color: var(--ink); }
.btn-brass:hover { background: #d4ab62; }
.btn-line { border-color: #4b535a; color: #f1f2ee; background: transparent; }
.btn-line:hover { border-color: var(--brass); }
.paper .btn-line { border-color: var(--paper-rule); color: var(--text); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(20,23,26,.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--ink-rule); color: #f1f2ee; }
.bar .wrap { display: flex; align-items: center; gap: 24px; min-height: 64px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: inherit; white-space: nowrap; }
.brand b { font: 900 21px/1 var(--display); font-stretch: 68%; text-transform: uppercase; letter-spacing: .02em; }
.brand span { font: 500 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
.nav { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav a { color: var(--ink-text); text-decoration: none; font-size: 14px; padding: 8px 10px; border-radius: var(--radius); white-space: nowrap; }
.nav a:hover { color: #fff; background: var(--ink-2); }
.lang { display: flex; border: 1px solid #4b535a; border-radius: var(--radius); overflow: hidden; flex: none; }
.lang button { background: transparent; color: var(--ink-text); border: 0; min-width: 44px; min-height: 40px; font: 600 12px/1 var(--mono); letter-spacing: .08em; cursor: pointer; }
.lang button[aria-pressed="true"] { background: #f1f2ee; color: var(--ink); }
.bar .btn { min-height: 40px; padding: 0 16px; font-size: 13px; flex: none; }
@media (max-width: 900px) { .nav { display: none; } .bar .wrap { justify-content: space-between; } }
@media (max-width: 420px) { .bar .btn { display: none; } }

/* hero */
.hero .wrap { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 6fr); gap: clamp(32px, 5vw, 64px); align-items: center; padding-block: clamp(48px, 7vw, 96px) clamp(56px, 8vw, 104px); }
.hero h1 { font-size: clamp(48px, 6.4vw, 92px); }
.hero h1 > span { display: block; }
.hero h1 .l2 { color: var(--brass); }
.hero .stack { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.hero .tagline { margin: 0; font-style: italic; color: var(--ink-muted); }
.hero .req { margin: 0; font: 500 12.5px/1.5 var(--mono); color: var(--ink-muted); }
.row { display: flex; flex-wrap: wrap; gap: 12px; }
@media (max-width: 860px) { .hero .wrap { grid-template-columns: minmax(0, 1fr); } .hero figure { order: -1; } }

/* media frames */
.film { position: relative; margin: 0; background: #0c0e10; border-radius: var(--radius); overflow: hidden; }
.film video, .film img { width: 100%; height: 100%; object-fit: cover; }
.film button.open { position: absolute; inset: 0; background: transparent; border: 0; cursor: zoom-in; }
.film .snd { position: absolute; left: 12px; bottom: 12px; z-index: 2; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px;
  background: rgba(12,14,16,.86); color: #f1f2ee; border: 1px solid #4b535a; border-radius: 999px; font: 600 11.5px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; cursor: pointer; }
.film .snd:hover { border-color: var(--brass); }
.film .snd svg { width: 16px; height: 16px; }
.film .badge { position: absolute; right: 10px; top: 10px; z-index: 2; font: 600 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); background: var(--brass); padding: 6px 8px; border-radius: 2px; }
.stamp { position: absolute; right: -10px; top: -16px; z-index: 3; transform: rotate(4deg); border: 3px solid var(--stamp-light); color: var(--stamp-light); background: var(--ink);
  font: 900 14px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; padding: 8px 12px; pointer-events: none; }
figcaption { margin-top: 10px; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
.ink figcaption { color: var(--ink-muted); }
.hero .film { aspect-ratio: 16 / 10; border: 1px solid var(--ink-rule); overflow: visible; }
.hero .film video, .hero .film img { border-radius: var(--radius); }

/* facts */
.facts { background: var(--brass); color: var(--ink); }
.facts .wrap { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px; padding-block: 22px; }
.fact { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fact b { font: 900 clamp(34px, 4vw, 46px)/1 var(--display); font-stretch: 68%; font-variant-numeric: tabular-nums; }
.fact span { font-size: 13.5px; font-weight: 500; line-height: 1.35; }
@media (max-width: 860px) { .facts .wrap { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 480px) { .facts .wrap { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* sections */
.section { padding-block: clamp(64px, 9vw, 112px); }
.head { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 32px; align-items: end; margin-bottom: clamp(28px, 4vw, 44px); }
.head > div { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (max-width: 860px) { .head { grid-template-columns: minmax(0, 1fr); } }

/* first week */
.week { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.week li { background: var(--paper-2); border: 1px solid var(--paper-rule); border-top: 4px solid var(--ink); padding: 16px 14px 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.week li.op { background: var(--ink); color: #f1f2ee; border-color: var(--ink); border-top-color: var(--stamp-light); }
.week .d { font: 600 11.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--brass-deep); }
.week li.op .d { color: var(--stamp-light); }
.week h3 { margin: 0; font: 700 16px/1.25 var(--body); }
.week p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
.week li.op p { color: var(--ink-text); }
@media (max-width: 1100px) { .week { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 640px) { .week { grid-template-columns: minmax(0, 1fr); } }

/* directory of departments */
.dir { list-style: none; margin: 40px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0; border-top: 2px solid var(--ink); }
.dir a { display: flex; gap: 12px; align-items: baseline; padding: 14px 4px; border-bottom: 1px solid var(--paper-rule); text-decoration: none; color: var(--text); }
.dir a:hover { background: var(--paper-2); }
.dir .n { font: 600 12px/1 var(--mono); color: var(--brass-deep); min-width: 2.2em; }
.dir .t { font: 800 16px/1.2 var(--display); text-transform: uppercase; letter-spacing: .02em; }

/* departments */
.dept { padding-block: clamp(64px, 8vw, 104px); scroll-margin-top: 64px; }
.dept.paper { background: var(--paper); }
.dept.alt { background: #dfe3dc; }
.dept .grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(28px, 4vw, 56px); align-items: start; }
.dept.flip .grid > .media { order: 2; }
@media (max-width: 960px) { .dept .grid { grid-template-columns: minmax(0, 1fr); } .dept.flip .grid > .media { order: 0; } .dept .copy { display: contents; } .dept .copy > .eyebrow, .dept .copy > h2, .dept .copy > .lede { order: -1; } .dept .grid { gap: 16px; } .dept .copy > .lede { margin-bottom: 12px; } }
.dept .copy { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.dept .lede { color: inherit; opacity: .86; }
.points { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; counter-reset: p; }
.points li { counter-increment: p; display: grid; grid-template-columns: 2.4em minmax(0, 1fr); gap: 10px; padding: 12px 0; border-top: 1px solid var(--paper-rule); font-size: 15.5px; line-height: 1.55; }
.ink .points li { border-top-color: var(--ink-rule); color: var(--ink-text); }
.points li::before { content: counter(p, decimal-leading-zero); font: 600 12px/1.9 var(--mono); color: var(--brass-deep); }
.ink .points li::before { color: var(--brass); }
.memo { margin: 8px 0 0; background: var(--paper-2); color: var(--text); border: 1px solid var(--paper-rule); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; transform: rotate(-.5deg); box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 10px 24px -16px rgba(0,0,0,.35); }
.memo .who { font: 600 11px/1.2 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--brass-deep); }
.memo q { font-size: 16.5px; line-height: 1.45; font-style: italic; quotes: "\201C" "\201D"; }
.media { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.media .lead { aspect-ratio: 16 / 10; }
.strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.strip .film { aspect-ratio: 4 / 3; }
.strip.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.strip.n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 600px) { .strip, .strip.n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* mecha frames */
.frames { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.frame { background: var(--ink-2); border: 1px solid var(--ink-rule); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.frame .film { aspect-ratio: 4 / 3; border-radius: 0; }
.frame .meta { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.frame .code { font: 600 11px/1 var(--mono); letter-spacing: .12em; color: var(--brass); }
.frame h3 { margin: 0; font: 900 24px/1 var(--display); font-stretch: 72%; text-transform: uppercase; }
.frame .move { font: 500 12.5px/1.3 var(--mono); color: var(--teal-light); }
.frame p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink-text); }
@media (max-width: 1000px) { .frames { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .frames { grid-template-columns: minmax(0, 1fr); } }

/* memo board */
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.board .memo { margin: 0; }
.board .memo:nth-child(3n+2) { transform: rotate(.6deg); }
.board .memo:nth-child(3n) { transform: rotate(-1deg); }

/* footage wall */
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--paper-rule); background: transparent; color: var(--text); font: 500 14px/1 var(--body); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: #f1f2ee; border-color: var(--ink); }
.filters .count { font: 500 12px/1 var(--mono); opacity: .7; margin-left: 6px; }
.wall { margin-top: 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-flow: dense; gap: 10px; }
.wall .film { aspect-ratio: 1 / 1; }
.wall .film.big { grid-column: span 2; grid-row: span 2; }
@media (max-width: 900px) { .wall { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .wall { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.empty { margin-top: 24px; color: var(--muted); }

/* download */
.apply .wrap { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(32px, 5vw, 64px); padding-block: clamp(64px, 8vw, 104px) 40px; }
.apply h2 { font-size: clamp(48px, 7vw, 88px); }
.apply .stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.apply dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 20px; border-top: 1px solid var(--ink-rule); padding-top: 18px; font-size: 15px; }
.apply dt { color: var(--ink-muted); }
.apply dd { margin: 0; }
.apply h3 { margin: 8px 0 0; font: 600 12px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
.apply ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; color: var(--ink-text); font-size: 14.5px; }
.apply ul b { color: #f1f2ee; }
.small { margin: 0; font-size: 13px; color: var(--ink-muted); }
.foot { border-top: 1px solid var(--ink-rule); }
.foot .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-block: 22px 32px; font-size: 13px; color: var(--ink-muted); }
@media (max-width: 860px) { .apply .wrap { grid-template-columns: minmax(0, 1fr); } }

/* lightbox */
dialog.lb { width: min(1100px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--ink-rule); background: var(--ink); color: #f1f2ee; border-radius: var(--radius); }
dialog.lb::backdrop { background: rgba(8,9,10,.82); }
.lb .stage { background: #000; display: flex; align-items: center; justify-content: center; }
.lb .stage video, .lb .stage img { width: 100%; max-height: calc(100vh - 180px); object-fit: contain; }
.lb .bar2 { display: flex; gap: 12px; align-items: center; padding: 12px 14px; }
.lb .cap { flex: 1; min-width: 0; font-size: 14px; line-height: 1.5; color: var(--ink-text); }
.lb button { min-width: 44px; min-height: 44px; background: var(--ink-2); color: #f1f2ee; border: 1px solid var(--ink-rule); border-radius: var(--radius); cursor: pointer; font: 600 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 0 12px; }
.lb button:hover { border-color: var(--brass); }

.top { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 15; min-height: 44px; padding: 0 14px;
  display: inline-flex; align-items: center; background: var(--ink); color: #f1f2ee; border: 1px solid var(--ink-rule); border-radius: var(--radius); font: 600 11.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; text-decoration: none; }
/* ---- review pass ---- */
.brand { align-items: center; }
.brand .mark { width: 28px; height: 28px; flex: none; }
.slip { display: grid; gap: 8px; max-width: 26rem; padding: 14px 16px; border: 1px dashed #4b535a; border-radius: 2px; font: 500 12px/1.3 var(--mono); color: var(--ink-muted); }
.slip-no { color: var(--brass); letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
.slip-line { display: flex; align-items: flex-end; gap: 10px; }
.slip-line > span { white-space: nowrap; }
.slip-line i { flex: 1; border-bottom: 1px solid #4b535a; height: 1em; }
.slip-line b { flex: 1; border-bottom: 1px solid #4b535a; font: italic 600 17px/1 "IBM Plex Sans", serif; color: var(--teal-light); letter-spacing: .02em; padding-left: 4px; }
.hero .tagline { display: none; }

.figures { background: var(--paper-2); border-bottom: 1px solid var(--paper-rule); }
.figures .wrap { padding-block: 28px 22px; display: flex; flex-direction: column; gap: 14px; }
.fig-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font: 600 11.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
.fig-row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.fig-row .fact { padding: 6px 16px 10px; border-left: 1px solid var(--paper-rule); }
.fig-row .fact:first-child { border-left: 0; padding-left: 0; }
.fig-row b { font: 900 clamp(32px, 3.6vw, 44px)/1 var(--display); font-stretch: 68%; font-variant-numeric: tabular-nums; color: var(--ink); }
.fig-row span { font-size: 13.5px; line-height: 1.35; color: var(--muted); }
.fig-row sup { font: 500 10px/1 var(--mono); color: var(--brass-deep); margin-left: 2px; }
.fig-notes { margin: 0; padding: 10px 0 0 18px; border-top: 1px solid var(--paper-rule); columns: 2 22rem; column-gap: 32px; font-size: 12px; line-height: 1.5; color: var(--muted); }
.fig-notes li { break-inside: avoid; margin-bottom: 4px; }
@media (max-width: 860px) { .fig-row { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 14px; } .fig-row .fact:nth-child(4) { border-left: 0; padding-left: 0; } }
@media (max-width: 480px) { .fig-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fig-row .fact { border-left: 0; padding-left: 0; } }

.points { list-style: none; }
.points li { grid-template-columns: minmax(0, 1fr); }
.points li::before { content: none; }
.points.ordered li { grid-template-columns: 2.4em minmax(0, 1fr); }
.points.ordered li::before { content: counter(p, decimal-leading-zero); }
.memo.flat { transform: none; }
.ink .memo { background: var(--ink-2); color: #f1f2ee; border-color: var(--ink-rule); box-shadow: none; }
.ink .memo .who { color: var(--brass); }

.film.tall video, .film.tall img { object-fit: contain; }
.tile { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tcap { font-size: 12.5px; line-height: 1.4; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ink .tcap { color: var(--ink-muted); }
.strip { align-items: start; }

}

.strip .snd span, .wall .snd span, .frame .snd span, .strip .badge, .frame .badge { display: none; }
