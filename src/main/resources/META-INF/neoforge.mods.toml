modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Based on an idea posted to r/feedthebeast in 2020 and GlebTiK's unfinished Head In A Jar prototype."
description='''${mod_description}'''

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="${geckolib_version_range}"
ordering="NONE"
side="BOTH"

# Optional integrations: none is needed. A version older than the one each hook was written against is refused by the
# loader with a clear message instead of failing later; newer ones are guarded in code (compat/).
[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="[9.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="[15.0.0,)"
ordering="NONE"
side="BOTH"

# the Employee Handbook is a Patchouli book
[[dependencies.${mod_id}]]
modId="patchouli"
type="optional"
versionRange="*"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="entity_model_features"
type="optional"
versionRange="[3.0.0,)"
ordering="NONE"
side="CLIENT"

# Vanilla Backport: newer vanilla content on 1.21.1, under the minecraft namespace. 1.2.2 is the version the hooks are
# written against (older ones lack some of its mobs and blocks). AFTER: it is loaded first, so in each registry its
# entries are added before ours and its event listeners run before ours.
[[dependencies.${mod_id}]]
modId="vanillabackport"
type="optional"
versionRange="[1.2.2,)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="headinajar.mixins.json"
